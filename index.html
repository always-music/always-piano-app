.memo-swatch{width:20px;height:20px;border-radius:50%;background:var(--sw);border:2px solid #fff;box-shadow:0 0 0 1px #D6D6DC;transition:transform .15s ease}.memo-swatch.hl{border-radius:5px}.memo-swatch:hover{transform:scale(1.15)}

.home-tasks .card{height:100%;display:flex;flex-direction:column}.home-tasks .card-header{padding:12px 16px 6px}.home-tasks .task-panel{padding:0 16px 10px;display:grid;grid-template-columns:auto 1fr;column-gap:14px;align-items:center}

.home-board{align-items:stretch}.home-weekly{display:flex}.home-weekly>.card{flex:1;display:flex;flex-direction:column}

.need-badge{padding:3px 3px 3px 12px!important;gap:8px!important;background:#C8382D!important;border:none!important;color:#fff!important;font-size:13px!important;font-weight:700!important;box-shadow:0 6px 14px -6px rgba(200,56,45,.7);transition:transform .15s,box-shadow .15s,background-color .15s!important}
.need-badge:hover{background:#B02E24!important;transform:translateY(-1px);box-shadow:0 10px 18px -8px rgba(200,56,45,.8)}.need-badge:active{transform:none}
.need-badge i{background:#fff!important}.need-badge .nb-t b{font-size:14.5px;font-weight:800;margin:0 1px}
.nb-go{display:inline-flex;align-items:center;gap:2px;padding:4px 8px 4px 11px;border-radius:999px;background:#fff;color:#B02E24;font-weight:800;font-size:12.5px}
.nb-go svg{width:14px;height:14px;fill:none;stroke:currentColor;stroke-width:2.6;stroke-linecap:round;stroke-linejoin:round;transition:transform .15s}.need-badge:hover .nb-go svg{transform:translateX(2px)}
/* 휴대폰: 보강 버튼은 제목 아래 한 줄 전체 · 헤더 날짜가 상단 바에 가리지 않게 */
@media(max-width:760px){
.home-wkm .card-header{flex-wrap:wrap}.home-wkm .card-header>div:first-child{flex:1 1 auto;min-width:0}
.home-wkm .card-header h2{display:block}
.home-wkm .need-badge{display:flex!important;width:100%;justify-content:space-between;margin:10px 0 2px!important;padding:5px 5px 5px 14px!important;font-size:14px!important}
.home-wkm .need-badge .nb-go{padding:6px 10px 6px 13px;font-size:13.5px}
.m-hero{padding-top:18px!important}
}
/* 휴대폰: + 수업 버튼 없앰(모든 시간 줄에 + 있음), 보강 버튼은 제목 옆 한 줄에 작게 */
@media(max-width:760px){
.home-wkm .card-header h2{display:flex!important;align-items:center;gap:8px;flex-wrap:nowrap;white-space:nowrap}
.home-wkm .need-badge{display:inline-flex!important;width:auto!important;margin:0!important;padding:3px 3px 3px 10px!important;font-size:12px!important;gap:6px!important}
.home-wkm .need-badge .nb-go{padding:3px 7px 3px 9px;font-size:12px}.home-wkm .need-badge .nb-t b{font-size:13px}
.wkm-row:not(:has(.weekly-chip)){padding-top:4px!important;padding-bottom:4px!important;opacity:.85}
}
/* 팝업이 떠 있으면 뒤 화면은 고정(드래그해도 안 움직임), 팝업 안만 스크롤 */
html:has(#detail-dialog[open]),html:has(.del-confirm),html:has(.wq-pop),html:has(#detail-dialog[open]) body,html:has(.del-confirm) body,html:has(.wq-pop) body{overflow:hidden!important;overscroll-behavior:none}
html:has(#detail-dialog[open]) .main-wrap,html:has(#detail-dialog[open]) .content,html:has(.del-confirm) .content,html:has(.wq-pop) .content{overflow:hidden!important}
#detail-dialog,.del-confirm,.wq-pop,.need-list,.xlsx-preview{overscroll-behavior:contain}
.del-confirm{touch-action:none}.del-confirm .del-box{touch-action:auto}
/* 부원장 체크 */
.vice-pick{display:flex;align-items:center;gap:8px;margin:4px 0 2px;padding:10px 12px;border:1px solid #E6DCCD;border-radius:10px;background:#FBF8F3;font-size:14px;cursor:pointer}
.vice-pick input{width:18px;height:18px;accent-color:#3D2B1F}
.role-pill{display:inline-block;padding:2px 10px;border-radius:999px;font-size:12px;font-weight:700;background:#F1EEEA;color:#6B6058;border:1px solid #E4DED6}.role-pill.vice{background:#3D2B1F;color:#FFF8EE;border-color:#3D2B1F}
/* 캘린더 칸: 왼쪽 보강 · 오른쪽 결석 각각 한 줄(세로)씩 */
.cal-cols{display:grid;grid-template-columns:1fr 1fr;gap:3px;margin-top:2px}
.cal-col{display:flex;flex-direction:column;min-width:0}
.cal-col .cal-mk,.cal-col .cal-abs,.cal-col .cal-more{padding:1px 4px!important;text-align:center;font-size:10.5px!important}
.cal-col .cal-mk,.cal-col .cal-abs,.cal-col .cal-more{padding:1px 1px!important;letter-spacing:-.06em;text-overflow:clip!important;font-size:clamp(9.5px,.7vw,11px)!important}.cal-cols{gap:2px}
html.using-pointer :focus,html.using-pointer :focus-visible{outline:none!important}
</style>

  <script>
(function(P){
const e=P.escape,ic=P.icon;
P.routeLink=(group,page,label,cls='text-link')=>`<a class="${cls}" href="#${group}/${page}">${label}${ic('arrow')}</a>`;
P.badge=(text,tone='')=>`<span class="pill ${tone}"><span class="dot"></span>${e(text)}</span>`;
P.card=(title,content,extra='',sub='')=>`<section class="card"><div class="card-header"><div><h2>${title}</h2>${sub?`<p class="sub">${sub}</p>`:''}</div>${extra}</div>${content}</section>`;
P.table=(headers,rows,emptyMessage=P.live?'조회 결과가 없습니다.':'표시할 샘플 데이터가 없습니다.')=>`<div class="table-scroll"><table><thead><tr>${headers.map(h=>`<th scope="col">${h}</th>`).join('')}</tr></thead><tbody>${rows.length?rows.join(''):`<tr><td class="empty-cell" colspan="${headers.length}">${e(emptyMessage)}</td></tr>`}</tbody></table></div>`;
P.metric=(title,value,unit,foot,icon)=>`<section class="metric"><div class="metric-top">${title}<span class="metric-symbol">${ic(icon)}</span></div><div class="metric-value">${value}<span>${unit}</span></div><div class="metric-foot">${foot}</div></section>`;
P.calendarCells=function(year,month){
 const first=new Date(Date.UTC(year,month,1)).getUTCDay(),days=new Date(Date.UTC(year,month+1,0)).getUTCDate();
 return [...Array(first).fill(0),...Array.from({length:days},(_,i)=>i+1)];
};
P.calendar=function(state,big=false,kind='정규'){
 const {year,month}=state.calendar;
 const current=year===2026&&month===9;
 const controls=`<div class="calendar-arrows"><button class="icon-btn prev" data-month="-1" aria-label="이전 달">${ic('chevron')}</button><button class="icon-btn" data-month="1" aria-label="다음 달">${ic('chevron')}</button></div>`;
 const weekdays=['일','월','화','수','목','금','토'].map(d=>`<div class="calendar-weekday">${d}</div>`).join('');
 const lessons=P.visibleLessons(state.role).filter(l=>l.kind===kind);
 let cells=P.calendarCells(year,month);
 if(big) while(cells.length%7)cells.push(0);
 const grid=cells.map((day,index)=>{
  const today=current&&day===26;
  if(big)return `<div class="big-day ${today?'today':''}">${day||''}${today?lessons.map(l=>`<span class="calendar-chip ${kind==='보강'?'makeup':''}">${l.time} ${e(P.mock.students.find(s=>s.id===l.studentId).name)}</span>`).join(''):''}</div>`;
  return `<div class="day ${!day?'empty':''} ${index%7===0?'sun':''} ${today?'today':''} ${current&&day===30?'event':''}" ${today?'aria-current="date"':''}>${day||''}</div>`;
 }).join('');
 const body=`<div class="${big?'calendar-scroll':'mini-calendar'}"><div class="${big?'big-calendar':''}"><div class="calendar-grid">${weekdays}${grid}</div>${!big&&current?`<div class="calendar-event"><div class="event-date">10월<strong>30</strong></div><div><p>가을 연주회 곡목 취합</p><small>운영 일정 · 샘플</small></div></div>`:(!big?'<p class="subtitle">이 달에 등록된 샘플 일정이 없습니다.</p>':'')}</div></div>`;
 return P.card(`<span class="calendar-title">${year}년 ${month+1}월${big?' · '+kind+' 수업':''}</span>`,body,controls,big?'10월 26일 수업만 표시한 캘린더 UI 샘플':'이달의 일정');
};
P.lessonTable=function(role,kind){
 const rows=P.visibleLessons(role).filter(l=>!kind||l.kind===kind).map(l=>{
  const student=P.mock.students.find(s=>s.id===l.studentId),teacher=P.mock.teachers.find(t=>t.id===l.teacherId);
  return `<tr><td class="time">${l.time}<span class="sub">${l.duration}분</span></td><td><span class="student-name">${e(student.name)}</span><span class="sub">${e(student.level)}</span></td><td>${e(teacher.name)}<span class="sub">${e(l.room)}</span></td><td>${P.badge(l.kind,l.kind==='보강'?'orange':'')}</td><td>${P.badge(l.status,l.status==='완료'?'green':'outline')}</td><td><button class="row-button" data-lesson="${l.id}" aria-label="${e(student.name)} ${l.time} 수업 상세 보기">${ic('chevron')}</button></td></tr>`;
 });
 return P.table(['시간','학생 / 진도','강사 / 레슨실','구분','상태','상세'],rows);
};
P.chart=function(){
 const data=P.mock.months;
 const bars=data.map((m,i)=>{
 const x=63+i*77,hi=m.income*.17,he=m.expense*.17;

  <script>
(function(P){

P.timeOptions=(times,value)=>{const list=value&&!times.includes(value)?[value,...times]:times;return list.length?list.map(t=>`<option value="${t}" ${t===value?'selected':''}>${t}</option>`).join(''):'<option value="" selected disabled>수업 없는 날</option>';};
const timeField=(times,value)=>`<label class="field">시작 시간<select name="time" required data-time-select aria-describedby="err-time">${P.timeOptions(times,value)}</select>${fieldError('time')}</label>`;
const durationField=value=>{const list=P.data.durations||[40,50];return `<label class="field">수업 길이<select name="duration" required aria-describedby="err-duration">${list.map(m=>`<option value="${m}" ${Number(value)===m?'selected':''}>${m}분</option>`).join('')}${value&&!list.includes(Number(value))?`<option value="${value}" selected>${value}분 (이전 기록)</option>`:''}</select>${fieldError('duration')}</label>`;};
// 2026-11-01 is a Sunday, so '2026-11-0'+(1+d) is a sample date for weekday d (1=Mon … 6=Sat).
const weekdaySample=d=>'2026-11-0'+(1+d);
const allSlots=()=>{const s=new Set();for(let d=1;d<=6;d++)P.slotTimes(weekdaySample(d)).forEach(t=>s.add(t));return [...s].sort();};
const studentField=(students,value)=>`<label class="field">학생<select name="studentId" required aria-describedby="err-studentId"><option value="" disabled ${value?'':'selected'}>학생 선택</option>${students.map(x=>`<option value="${e(x.id)}" ${x.id===value?'selected':''}>${e(x.name)}</option>`).join('')}</select>${fieldError('studentId')}</label>`;
const lessonActions=(label,busy)=>`<p class="form-error" role="alert"></p><div class="form-actions"><button type="button" class="btn" data-action="close-dialog">취소</button><button class="btn primary" type="submit" data-busy-label="${busy}">${label}</button></div>`;
const minutes=t=>{const [h,m]=String(t).split(':').map(Number);return h*60+m;};
const clock=m=>String(Math.floor(m/60)%24).padStart(2,'0')+':'+String(m%60).padStart(2,'0');
const isDate=v=>/^\d{4}-\d{2}-\d{2}$/.test(v)&&new Date(v+'T00:00:00Z').toISOString().slice(0,10)===v;

// Same rule as the server: end date may be at most 6 calendar months after the start (day clamped to month end).
P.addMonths=function(date,n){const d=new Date(date+'T12:00:00Z'),day=d.getUTCDate();d.setUTCDate(1);d.setUTCMonth(d.getUTCMonth()+n);d.setUTCDate(Math.min(day,new Date(Date.UTC(d.getUTCFullYear(),d.getUTCMonth()+1,0)).getUTCDate()));return d.toISOString().slice(0,10);};

P.checkLessonForm=function(form,showAll=false){
 if(form.dataset.lessonForm==='weekly')return P.checkWeeklyForm(form,showAll);
 const f=new FormData(form),series=form.dataset.lessonForm==='series',err={},v=n=>String(f.get(n)||'').trim(),dur=Number(v('duration')),time=v('time');let count=0;

 if(form.elements.teacherId?.tagName==='SELECT'&&!v('teacherId'))err.teacherId='수업할 강사를 선택해 주세요.';
 // Same opening-hours rule as the server's slotCheck_ (start inside the day's hours, on a 30-minute slot).
 const fits=d=>{const h=P.hoursFor(d),wd='일월화수목금토'[new Date(d+'T12:00:00Z').getUTCDay()];if(!h)return '일요일은 수업이 없습니다.';const s=minutes(time),[a,b]=h.map(minutes);return s<a||s>=b||s%step?`${wd}요일 수업 시작 시간은 ${h[0]}~${h[1]} 사이예요.`:'';};

  if(!isDate(b))err.endDate='종료일을 입력해 주세요.';else if(!err.startDate&&b<a)err.endDate='종료일은 시작일과 같거나 이후여야 합니다.';else if(!err.startDate&&b>P.addMonths(a,6))err.endDate=`최대 6개월(${md(P.addMonths(a,6))})까지 지정할 수 있습니다.`;

 const item=x=>`<div class="pay-row"><div class="pay-main"><strong>${e(x.studentName)} · ${e(x.instrument)}</strong><span class="sub">${x.state==='needed'?`${x.prevSeq?`${x.prevSeq}번째 회차권 ${x.used}/${x.count}회 사용 → `:'첫 회차권 · '}${x.seq}번째 회차권`:`${x.seq}번째 회차권 · ${x.used}/${x.count}회`} · ${wonOr(x.price)} · 다음 수업 ${x.nextDate?mdText(x.nextDate):'없음'}${x.requestedAt?` · 요청 ${mdText(x.requestedAt.slice(0,10))}`:''}</span></div>${P.badge(PSTATE[x.state][0],PSTATE[x.state][1])}<div class="pay-acts">${x.state==='needed'?btn('request',x,'요청 완료')+btn('confirm',x,'납부 확인',true):x.state==='requested'?btn('confirm',x,'납부 확인',true):btn('ack',x,'확인 완료')}</div></div>`;
 const sec=(state,title)=>{const l=p.filter(x=>x.state===state);return l.length?`<h3 class="pay-title">${title} ${l.length}건</h3>${l.map(item).join('')}`:'';};
 return `<div class="pay-dialog">${sec('needed','납부 요청 필요')}${sec('requested','요청 후 납부 미확인')}${sec('recheck','출결 정정으로 재확인 필요')}${p.length?'':'<p class="empty-cell">처리할 납부 알림이 없습니다.</p>'}<p class="sub">다음 수업이 가까운 순서 · 마지막 갱신 <span data-sync-time>${P.syncTime()}</span> · 요청 완료만으로는 회차가 충전되지 않아요. 앱 안 알림만 쓰고 문자·카톡은 보내지 않아요.</p></div>`;};
})(Piano);

  <script>
(function(P){
'use strict';
P.live=!!(window.google&&google.script&&google.script.run);
P.user=null;P.data={students:[],teachers:[],lessons:[],journals:[],tasks:[],notices:[],date:''};
let token='',persist=false;
const app=()=>document.getElementById('app'),esc=P.escape,key='always-piano.session.v1';
function storage(name,operation,value){try{const s=window[name];if(operation==='get')return s.getItem(key);if(operation==='set')s.setItem(key,value);else s.removeItem(key);}catch{}return null;}
function clearSession(){P.clearViewState?.();P.viewAs=null;P.realSession=null;token='';P.user=null;P.data={students:[],teachers:[],lessons:[],journals:[],tasks:[],notices:[],date:''};storage('localStorage','remove');storage('sessionStorage','remove');}
function acceptSession(session){token=session.token;P.user=session.user;persist=session.remember===true;storage('localStorage','remove');storage('sessionStorage','remove');storage(persist?'localStorage':'sessionStorage','set',JSON.stringify({token,expiresAt:session.expiresAt}));}
function rpc(name,arg){return new Promise((resolve,reject)=>{
 google.script.run.withSuccessHandler(response=>{if(response&&response.ok)resolve(response.data);else{const error=new Error(response?.error?.message||'서버 응답을 확인할 수 없습니다.');error.code=response?.error?.code||'INTERNAL';reject(error);}}).withFailureHandler(()=>reject(new Error('서버에 연결하지 못했습니다. 잠시 후 다시 시도해 주세요.')))[name](arg);
});}
P.api=async function(action,payload={},requestId){try{return await rpc('academyApi',P.viewAs?{token,action,payload,requestId,actAs:P.viewAs}:{token,action,payload,requestId});}catch(error){if(error.code==='UNAUTHENTICATED'){clearSession();loginScreen(error.message);}else if(error.code==='PASSWORD_CHANGE_REQUIRED'&&!document.getElementById('password-form'))passwordScreen();throw error;}};
P.refreshData=async function(){P.data=await P.api('bootstrap');P.user=P.data.user;lastSync=Date.now();P.applyOpt();};
// Saves still in flight stay on screen even if fresh data arrives meanwhile (no vanish-and-reappear).
P._opt={weekly:[],roster:[],moves:{}};
P.applyOpt=()=>{const o=P._opt,d=P.data;if(!d||!d.weekly)return;d.roster=d.roster||[];o.roster.forEach(r=>{if(!d.roster.some(x=>x.id===r.id))d.roster.push(r);});o.weekly.forEach(w=>{if(!d.weekly.some(x=>x.id===w.id))d.weekly.push(w);});Object.entries(o.moves).forEach(([id,m])=>{const w=d.weekly.find(x=>x.id===id);if(w)Object.assign(w,m,{pending:true});});};
// Background sync replaces the old refresh button: after navigation, when the tab comes back and every minute while visible.
// Re-renders only when data changed and the user is not mid-input (open dialog/menu or focused field).
var lastSync=Date.now(),syncing=false;
const dataSignature=d=>JSON.stringify({...d,serverTime:0});
P.syncData=async function(minAge=0){
 if(!P.live||!P.user||P.user.mustChangePassword||document.getElementById('password-form')||document.getElementById('login-form')||syncing||P.pendingSaves>0||Date.now()-lastSync<minAge)return;syncing=true;
 try{const before=dataSignature(P.data);await P.refreshData();document.querySelectorAll('[data-sync-time]').forEach(el=>{el.textContent=P.syncTime();});if(dataSignature(P.data)===before)return;
  if(document.querySelector('.memo-card.editing,#detail-dialog[open],.teacher-filter[open],.user-menu[open],#app-loading.show,.sidebar.open,.wq-pop,.del-confirm')||document.activeElement?.matches?.('input,select,textarea,[contenteditable="true"]'))return;
  P.refreshApp();}
 catch{}finally{syncing=false;}
};
// 원장·강사가 같은 자료를 봐요: 화면이 켜져 있으면 8초마다, 앱으로 돌아오면(휴대폰 화면 켜기·탭 전환) 바로 서버와 맞춰요.
// 창·입력 중이거나 저장 중이면 화면을 바꾸지 않고 다음 차례에 반영돼요.
document.addEventListener('visibilitychange',()=>{if(document.visibilityState==='visible')P.syncData(0);});
window.addEventListener('focus',()=>P.syncData(3000));
setInterval(()=>{if(document.visibilityState==='visible')P.syncData(7000);},8000);
// Director acting as a teacher: every request carries actAs, the server applies that teacher's role and scope
// (and records the director as the actor). P.realSession keeps the director's identity and teacher list.
P.viewAs=null;P.realSession=null;
P.switchView=async function(teacherId){
 const real=P.realSession||{user:P.user,data:{teachers:P.data.teachers,students:P.data.students}},prev=P.viewAs;
 if(real.user.role!=='director')return;
 const pick=teacherId?real.data.teachers.find(t=>t.id===teacherId):null,name=pick?String(pick.name).replace(/s*부원장$/,'')+(pick.vice?' 부원장님':' 선생님'):real.user.name;
 const done=P.showLoading(teacherId?`${name} 계정으로 전환하는 중…`:'원장 화면으로 돌아가는 중…');
 P.viewAs=teacherId||null;P.realSession=teacherId?real:null;
 try{await P.refreshData();}catch(error){P.viewAs=prev;P.realSession=prev?real:null;await done();P.refreshApp();P.notify(error.message);return;}
 P.lessonFilter={teachers:[],q:''};P.selectedDate=null;Object.assign(P.state,{group:'home',page:'overview',navGroup:'home'});history.replaceState(null,'','#home/overview');
 P.refreshApp();await done();document.getElementById('main')?.classList.add('view-enter');P.notify('');
};
// "강사 화면 보기" popup: director picks which account to work as.
P.openViewAs=function(){
 const real=P.realSession||{user:P.user,data:P.data},esc=P.escape,current=P.viewAs||'';
 const count=id=>(real.data.students||[]).filter(s=>s.teacherId===id&&s.status==='active').length;
 const option=(id,name,sub,color)=>`<button type="button" class="view-as-option ${current===id?'current':''}" data-view-as-pick="${esc(id)}" ${current===id?'aria-current="true"':''}><span class="view-as-avatar" style="${color?`background:${color}`:''}">${esc(name.slice(0,1))}</span><span class="view-as-text"><strong>${esc(name)}</strong><small>${esc(sub)}</small></span>${current===id?'<span class="view-as-badge">현재</span>':P.icon('chevron','view-as-chev')}</button>`;
 const teachers=real.data.teachers.filter(t=>t.status==='active'&&t.account&&t.account.status==='active');
 P.showDialog('강사 화면 보기',`<div class="view-as-list"><p class="view-as-intro">선택한 강사 계정으로 로그인한 것처럼 화면이 바뀌어요. 등록·수정은 원장 이름으로 기록돼요.</p>${option('',real.user.name+' 원장님','원장 화면 · 전체 관리')}<p class="view-as-group">강사 ${teachers.length}명</p>${teachers.map(t=>option(t.id,t.name.replace(/\s*부원장$/,'')+(t.vice?' 부원장님':' 선생님'),t.vice?'부원장 · 전체 관리':`담당 학생 ${count(t.id)}명`,P.teacherColor(t.id))).join('')||'<p class="empty-cell">로그인 계정이 있는 강사가 없습니다.</p>'}</div>`,'view');
};
// Home memo: 편집 opens the formatting toolbar; 저장 saves and closes it; 취소 restores the last saved note.
const memoMode=(card,on)=>{const body=card.querySelector('#memo-body');card.classList.toggle('editing',on);body.contentEditable=on?'true':'false';card.querySelector('[data-memo-edit]').textContent=on?'저장':'편집';card.querySelector('[data-memo-edit]').classList.toggle('primary',on);};
P.saveMemo=async function(){
 const body=document.getElementById('memo-body'),status=document.getElementById('memo-status');if(!body)return false;
 const html=P.sanitizeMemo(body.innerHTML);if(status)status.textContent='저장 중…';
 try{const r=await P.api('memo.save',{html},crypto.randomUUID());P.data.memo={html,updatedAt:r.updatedAt};if(status)status.textContent=P.memoTime(r.updatedAt);return true;}
 catch(error){if(status)status.textContent='저장 실패 · '+error.message;return false;}
};
document.addEventListener('click',async event=>{
 const card=event.target.closest('.memo-card');if(!card)return;const body=card.querySelector('#memo-body');
 if(event.target.closest('[data-memo-cancel]')){body.innerHTML=P.sanitizeMemo(P.data.memo?.html||'');card.querySelector('#memo-status').textContent=P.memoTime(P.data.memo?.updatedAt);memoMode(card,false);return;}
 const t=event.target.closest('[data-memo-edit]');if(!t)return;
 if(!card.classList.contains('editing')){memoMode(card,true);body.focus();const r=document.createRange();r.selectNodeContents(body);r.collapse(false);const s=document.getSelection();s.removeAllRanges();s.addRange(r);return;}
 // 바로 편집을 끝내고 화면에 남겨 둔 채 뒤에서 저장 (실패하면 다시 편집 상태로).
 memoMode(card,false);const prev=P.data.memo;P.data.memo={html:P.sanitizeMemo(document.getElementById('memo-body')?.innerHTML||''),updatedAt:prev?.updatedAt||''};P.saveStart();
 P.saveMemo().then(ok=>{if(ok){P.saveEnd();}else{P.saveEnd('메모를 저장하지 못했어요.');P.data.memo=prev;const c=document.querySelector('.memo-card');if(c)memoMode(c,true);}});
});
document.addEventListener('mousedown',event=>{if(event.target.closest('[data-memo-cmd],[data-memo-edit],[data-memo-cancel]'))event.preventDefault();});
document.addEventListener('click',event=>{
 const b=event.target.closest('[data-memo-cmd]');if(!b)return;const body=document.getElementById('memo-body');if(!body)return;
 if(!body.contains(document.getSelection()?.anchorNode))body.focus();
 document.execCommand('styleWithCSS',false,true);document.execCommand(b.dataset.memoCmd,false,b.dataset.memoArg||null);
});
document.addEventListener('input',event=>{if(event.target.id!=='memo-body')return;const s=document.getElementById('memo-status');if(s)s.textContent='편집 중 · 저장을 눌러 주세요';});
// Full-screen loading cover (outside #app so re-renders keep it). Returns a function that hides it after a short minimum so it never just flashes.
P.showLoading=function(text){
 let el=document.getElementById('app-loading');
 if(!el){el=document.createElement('div');el.id='app-loading';el.setAttribute('role','status');el.setAttribute('aria-live','assertive');el.innerHTML='<div class="loading-card"><span class="loading-spinner" aria-hidden="true"></span><p></p></div>';document.body.appendChild(el);}
 el.querySelector('p').textContent=text;el.classList.remove('hide');void el.offsetWidth;el.classList.add('show');
 const started=Date.now();
 return ()=>new Promise(resolve=>setTimeout(()=>{el.classList.remove('show');el.classList.add('hide');resolve();},Math.max(0,550-(Date.now()-started))));
};
P.authBoot=async function(){
 if(!P.live){P.user={id:'preview',name:'오프라인 미리보기',role:'director',teacherId:'t1'};P.startApp();return;}
 app().innerHTML='<div class="auth-shell"><p role="status">운영 워크스페이스를 불러오는 중입니다…</p></div>';
 let stored=storage('localStorage','get');persist=!!stored;if(!stored)stored=storage('sessionStorage','get');
 if(!stored){loginScreen();return;}
 // 저장된 로그인은 '로그인 만료·계정 변경'일 때만 지워요. 휴대폰 통신이 잠깐 끊기거나 서버가 늦어도 다시 시도하고, 로그인 정보는 그대로 둡니다.
 let s;try{s=JSON.parse(stored);}catch{clearSession();loginScreen();return;}
 if(!s||!s.token||Date.parse(s.expiresAt)<=Date.now()){clearSession();loginScreen('로그인이 만료되었습니다. 다시 로그인해 주세요.');return;}
 token=s.token;
 for(let tries=0;;tries++){try{P.user=await rpc('authResume',token);if(P.user.mustChangePassword){passwordScreen();return;}await P.refreshData();P.startApp();return;}
  catch(error){if(error.code==='UNAUTHENTICATED'||error.code==='FORBIDDEN'){clearSession();loginScreen(error.message);return;}if(error.code==='PASSWORD_CHANGE_REQUIRED'){passwordScreen();return;}
   if(tries<2){await new Promise(r=>setTimeout(r,1200*(tries+1)));continue;}
   app().innerHTML=`<div class="auth-shell"><div class="auth-card"><p role="alert">${esc(error.message||'서버에 연결하지 못했습니다.')}</p><button class="btn primary" type="button" data-resume-retry>다시 시도</button></div></div>`;app().querySelector('[data-resume-retry]').onclick=()=>P.authBoot();return;}}
};
function authHeader(title,subtitle){return `<div class="auth-brand">${document.getElementById('brand-template').innerHTML}<p class="eyebrow">ACADEMY WORKSPACE</p></div><h1>${title}</h1><p class="auth-subtitle">${subtitle}</p>`;}
function loginScreen(message=''){
 document.title='로그인 · Always Piano';document.body.style.overflow='';
 let username='';try{username=localStorage.getItem('always-piano.saved-id')||'';}catch{}
 app().innerHTML=`<main class="auth-shell"><section class="auth-card">${authHeader('함께 만드는 좋은 배움','원장·강사 계정으로 로그인해 주세요.')}<form id="login-form" class="auth-form"><label class="field">아이디<input name="username" autocomplete="username" maxlength="32" required value="${esc(username)}" placeholder="아이디"></label><label class="field">비밀번호<input name="password" type="password" autocomplete="current-password" maxlength="128" required placeholder="비밀번호"></label><div class="auth-options"><label><input type="checkbox" name="saveId" ${username?'checked':''}>아이디 저장</label><label><input type="checkbox" name="remember" ${window.APP_MODE?'checked':''}>로그인 유지 (14일)</label></div><p class="auth-help">공용 PC에서는 로그인 유지를 선택하지 마세요.</p><p class="form-error" role="alert">${esc(message)}</p><button class="btn primary auth-submit" type="submit">로그인</button><p class="auth-foot">Always Piano Academy · 개발용 워크스페이스</p></form></section></main>`;
 app().querySelector('[name="username"]').focus();
}
function passwordForm(forced){return `<form id="password-form" class="auth-form"><p class="subtitle">${forced?'처음 로그인하셨습니다. 초기 비밀번호를 변경해 주세요.':'비밀번호를 변경하면 다른 기기의 로그인도 만료됩니다.'}</p><label class="field">현재 비밀번호<input type="password" name="currentPassword" autocomplete="current-password" maxlength="128" required></label><label class="field">새 비밀번호<input type="password" name="newPassword" autocomplete="new-password" minlength="8" maxlength="128" required><small>8~128자로 입력해 주세요.</small></label><label class="field">새 비밀번호 확인<input type="password" name="confirmPassword" autocomplete="new-password" minlength="8" maxlength="128" required></label><p class="form-error" role="alert"></p><button type="submit" class="btn primary auth-submit">비밀번호 변경</button></form>`;}
function passwordScreen(){document.body.style.overflow='';app().innerHTML=`<main class="auth-shell"><section class="auth-card">${authHeader('비밀번호 변경',esc(P.user.name)+'님, 안전한 비밀번호로 변경해 주세요.')}${passwordForm(true)}<button class="text-link" data-live-action="logout">로그아웃</button></section></main>`;}
P.modal=(title,body,mode='edit')=>P.showDialog(title,body,mode);
P.notify=function(message){const n=document.getElementById('live-status');if(n)n.textContent=message;if(message&&P.saving)P.saving(message,'info');};
P.openPassword=()=>P.modal('비밀번호 변경',passwordForm(false));
P.loadHistory=async function(){const target=()=>document.getElementById('history-results');try{const list=await P.api('history.list');if(P.state.group==='lessons'&&P.state.page==='history'&&target())target().innerHTML=P.historyTable(list);}catch(error){if(target())target().innerHTML='<p class="empty-cell" role="alert">'+esc(error.message)+'</p>';}};
P.loadAccounts=async function(){try{const users=await P.api('accounts.list');if(P.state.group==='settings'&&P.state.page==='accounts'){P.accounts=users;document.getElementById('account-results').innerHTML=P.accountTable(users.filter(u=>u.role==='director'));}}catch(error){const target=document.getElementById('account-results');if(target)target.innerHTML='<p class="empty-cell" role="alert">'+esc(error.message)+'</p>';P.notify(error.message);}};
P.formOpen=function(kind,id){const r=kind==='student'?P.data.students.find(s=>s.id===id):kind==='teacher'?P.data.teachers.find(t=>t.id===id):kind==='lesson'?P.data.lessons.find(l=>l.id===id):null;P.modal(P.formTitle(kind,id),P.formHTML(kind,r));const lessonForm=document.querySelector('#detail-dialog form[data-lesson-form]');if(lessonForm)P.checkLessonForm(lessonForm);};
P.recordOpen=function(id){const lesson=P.data.lessons.find(l=>l.id===id);if(lesson)P.modal('출결·수업일지·진도',P.recordForm(lesson));};
async function logout(){try{if(token)await rpc('authLogout',token);}catch{}clearSession();loginScreen();}
// 시간표 빈칸 → 그 자리에 이름 입력 팝업 (Enter로 추가, Esc·바깥 클릭으로 닫기).
P.quickAdd=function(anchor,day,time){
 document.querySelector('.wq-pop')?.remove();const r=anchor.getBoundingClientRect(),pop=document.createElement('form');pop.className='wq-pop';pop.dataset.wqForm='';pop.dataset.day=day;pop.dataset.time=time;
 pop.innerHTML=`<p class="wq-title">${esc(time)} <span>· 50분 · 요일 여러 개 선택 가능</span></p><div class="wq-days">${[1,2,3,4,5,6].map(d=>`<button type="button" class="wq-day${String(d)===String(day)?' on':''}" data-wq-day="${d}">${'일월화수목금토'[d]}</button>`).join('')}</div>${P.wqInput()}<div class="wq-hint"></div><p class="form-error" role="alert"></p><div class="wq-act"><button type="button" class="btn" data-wq-close>취소</button><button type="submit" class="btn primary">추가</button></div>`;
 document.body.appendChild(pop);P.histPush?.('pop');const w=Math.min(300,innerWidth-24);pop.style.width=w+'px';pop.style.left=Math.max(12,Math.min(r.left,innerWidth-w-12))+'px';
 const below=r.bottom+6,h=pop.offsetHeight;pop.style.top=(below+h>innerHeight-8?Math.max(8,r.top-h-6):below)+'px';pop.querySelector('input').focus();
};
document.addEventListener('input',event=>{if(event.target.matches('[data-abs-names]'))P.absAddHint(event.target);if(event.target.matches('[data-wq-names]'))P.wqHint(event.target);if(event.target.matches('[data-wk-search]')){P.wkQ=event.target.value.trim();P.wkApplySearch();}});
document.addEventListener('click',event=>{if(event.target.closest('[data-wk-clear]')){P.wkQ='';P.wkApplySearch();const i=event.target.closest('.wk-search')?.querySelector('input');if(i){i.value='';i.focus();}}});
document.addEventListener('keydown',event=>{if(event.key==='Escape')document.querySelector('.wq-pop')?.remove();});

P.quickSave=async function(names,days,time,duration,picks){
 const list=[...new Set(String(names).split(/[,，]/).map(x=>x.trim()).filter(Boolean))];
 // 바로 화면에 표시(저장 중 표시) → 서버 저장 → 실패하면 되돌림
 const tmp=new Set();
 list.forEach(n=>{let st=(P.data.roster||[]).filter(x=>x.name===n);let id=st.length>1?picks[n]:st[0]?.id;if(!id){id='tmp-'+crypto.randomUUID();tmp.add(id);P.data.roster.push({id,name:n});}
  days.forEach(d=>{const wid='tmp-'+crypto.randomUUID();tmp.add(wid);P.data.weekly.push({id:wid,studentId:id,weekday:d,time,duration,version:1,pending:true});});});
 P._opt.weekly.push(...P.data.weekly.filter(w=>tmp.has(w.id)));P._opt.roster.push(...P.data.roster.filter(x=>tmp.has(x.id)));const drop=()=>{P._opt.weekly=P._opt.weekly.filter(w=>!tmp.has(w.id));P._opt.roster=P._opt.roster.filter(x=>!tmp.has(x.id));};
 P.saveStart();P.refreshApp();
 try{const r=await P.api('weekly.quick',{names,weekdays:days,time,duration,picks},crypto.randomUUID());
  drop();P.data.weekly=P.data.weekly.filter(w=>!tmp.has(w.id));(r.weekly||[]).forEach(w=>{if(!P.data.weekly.some(x=>x.id===w.id))P.data.weekly.push(w);});P.data.roster=P.data.roster.filter(x=>!tmp.has(x.id));(r.roster||[]).forEach(x=>{if(!P.data.roster.some(y=>y.id===x.id))P.data.roster.push(x);});P.refreshApp();P.saveEnd();P.saving(`저장됨 · ${r.added}명${r.created.length?` (새 학생 ${r.created.join(', ')})`:''}`,'done');}
 catch(error){drop();P.data.weekly=P.data.weekly.filter(w=>!tmp.has(w.id));P.data.roster=P.data.roster.filter(x=>!tmp.has(x.id));P.refreshApp();P.saveEnd(error.message);}
};

 catch(error){if(undo)undo();try{await P.refreshData();}catch(_e){}P.refreshApp();P.saveEnd(error.message);if(after)after();}};
P.bgSave=function(action,values,form){
 const close=()=>{form.dataset.saved='true';form.removeAttribute('aria-busy');const d=form.closest('dialog');if(d?.open)d.close();};
 if(action==='weekly.quick'){const ns=String(values.names||'').split(/[,，]/).map(x=>x.trim()).filter(Boolean),ro=P.data.roster||[];
  if(ns.some(n=>ro.filter(x=>x.name===n).some(st=>P.data.weekly.some(w=>w.studentId===st.id&&values.weekdays.includes(w.weekday)&&w.time===values.time))))return false;close();P.quickSave(values.names,values.weekdays,values.time,Number(values.duration||50),values.picks||{});return true;}
 if(action==='weekly.save'&&values.id){const w=P.data.weekly.find(x=>x.id===values.id);if(!w)return false;close();
  const next={studentId:values.studentId,weekday:Number(values.weekday),time:values.time,duration:Number(values.duration)};
  P.bgRun(action,values,()=>{const before={studentId:w.studentId,weekday:w.weekday,time:w.time,duration:w.duration};Object.assign(w,next,{pending:true});P._opt.moves[w.id]=next;return ()=>{delete P._opt.moves[w.id];Object.assign(w,before);delete w.pending;};},
   r=>{delete P._opt.moves[w.id];const cur=P.data.weekly.find(x=>x.id===w.id)||w;if(r&&r.version)cur.version=r.version;delete cur.pending;});return true;}
 // 학생·강사 저장: 서버 확인(아이디 중복·형식 등)이 끝날 때까지 창을 열어 두고(저장 중 표시), 성공하면 닫고 목록은 뒤에서 새로고침.

  return P.api(action,values,form.dataset.requestId).then(()=>{close();P.saving('저장됨','done');P.pendingSaves=(P.pendingSaves||0)+1;P.refreshData().catch(()=>{}).finally(()=>{P.pendingSaves--;P.refreshApp();});return true;});}
 return false;};

 }).join('')}</nav><div class="sidebar-bottom">${P.live&&(P.realSession||P.user).role==='director'&&!(P.realSession||P.user).vice?`<button type="button" class="view-as-trigger" data-view-as-open aria-haspopup="dialog"><span class="view-as-icon">${ic('students')}</span><span class="view-as-text"><strong>강사 화면 보기</strong><small>지금 · ${P.viewAs?e(P.user.name)+' '+P.honor():'원장 화면'}</small></span>${ic('chevron','view-as-chev')}</button>`:''}${P.live&&P.user?(()=>{const me=(P.realSession||{}).user||P.user;return `<div class="side-user"><span class="avatar">${e(String(me.name||'').slice(0,1))}</span><span class="side-user-text"><strong>${e(me.name)}</strong><small>${me.role==='director'?'원장':'강사'}</small></span><div class="side-user-actions"><button type="button" data-live-action="password">비밀번호 변경</button><button type="button" data-live-action="logout">로그아웃</button></div></div>`;})():`<div class="workspace-status"><strong><span class="status-dot"></span>함께 만드는 좋은 배움</strong>Always Piano Academy<br>UI 미리보기</div>`}<div class="sidebar-footer">© ALWAYS PIANO ACADEMY</div></div></aside>
 <div class="main-wrap"><header class="topbar"><button class="mobile-menu" data-action="open-menu" aria-label="메뉴 열기" aria-controls="sidebar" aria-expanded="false">${ic('menu')}</button><span class="tb-aurora" aria-hidden="true"></span>${(()=>{const src=document.getElementById('brand-template')?.content.querySelector('img')?.getAttribute('src');return src?`<a class="tb-logo-link" href="#home/overview" aria-label="홈으로"><img class="tb-logo" src="${src}" alt="Always Piano Academy"></a>`:'';})()}${P.live&&state.group==='home'?(()=>{const d=new Date((P.data.date||'')+'T12:00:00Z');return `<div class="tb-hello"><span>${d.getUTCMonth()+1}월 ${d.getUTCDate()}일 ${'일월화수목금토'[d.getUTCDay()]}요일</span><strong>${e(P.user.name)} ${P.honor()}, 반가워요</strong></div>`;})():''}<div class="breadcrumb"><span>워크스페이스</span>${ic('chevron')}<strong>${group.label} / ${page[1]}</strong></div><div class="top-actions">${P.live?`<details class="user-menu"><summary aria-label="사용자 메뉴"><span class="avatar">${e(P.user.name.slice(0,1))}</span><span class="user-label">${e(P.user.name)} · ${(P.user?.vice?'부원장':director?'원장':'강사')}</span>${ic('chevron')}</summary><div class="user-menu-panel"><p>${e(P.user.name)} · ${(P.user?.vice?'부원장':director?'원장':'강사')}</p><button data-action="notices">${ic('bell')}학원 소식</button><button data-live-action="password">비밀번호 변경</button><button data-live-action="logout">로그아웃</button></div></details>`:`<label class="role-picker"><span>화면 미리보기</span><select id="role-select" aria-label="역할별 화면 미리보기 (실제 로그인 아님)"><option value="director" ${director?'selected':''}>원장 화면</option><option value="teacher" ${!director?'selected':''}>강사 화면</option></select></label><button class="icon-btn" data-action="notices" aria-label="알림 미리보기">${ic('bell')}</button>`}</div></header>
 <main class="content" id="main" tabindex="-1">${P.viewAs?`<div class="view-as-banner" role="status"><span>${ic('teacher')}<strong>${e(P.user.name)} ${P.honor()}</strong> 계정으로 작업 중이에요 · 등록·수정은 원장 이름으로 기록돼요</span><button class="btn" data-view-as-exit>원장 화면으로 돌아가기</button></div>`:''}${P.live?'':'<div class="demo-banner"><span><strong>DEMO WORKSPACE</strong>오프라인 가상 데이터 미리보기 · 저장되지 않음</span><span>기준일 2026.10.26</span></div>'}<p id="live-status" class="live-status" role="status" aria-live="polite"></p>${P.page(state)}<footer class="footer"><span>ALWAYS PIANO ACADEMY · EVERY LITTLE NOTE COUNTS.</span><span>${P.live?'DEVELOPMENT WORKSPACE':'UI PROTOTYPE'} · ${(P.user?.vice?'부원장':director?'원장':'강사')} 화면</span></footer></main></div>
 <dialog id="detail-dialog" aria-labelledby="dialog-title"><div class="dialog-heading"><h2 id="dialog-title"></h2><button class="icon-btn" data-action="close-dialog" aria-label="상세 창 닫기">${ic('close')}</button></div><div class="dialog-content" id="dialog-content"></div><div class="dialog-foot"><span></span><button class="btn" data-action="close-dialog">닫기</button></div></dialog>`;
 document.title=page[1]+' · Always Piano';
 state.drawer=false;document.body.style.overflow='';
 updateDrawer();
 restoreView();
 if(P.live&&state.group==='settings'&&state.page==='accounts')P.loadAccounts();
 if(P.live&&state.group==='lessons'&&state.page==='history')P.loadHistory();
}
function updateDrawer(){
 const mobile=matchMedia('(max-width:900px)').matches;
 const sidebar=document.getElementById('sidebar');
 if(!sidebar)return;
 sidebar.classList.toggle('open',state.drawer);
 sidebar.inert=mobile&&!state.drawer;
 sidebar.setAttribute('aria-hidden',String(mobile&&!state.drawer));
 document.querySelector('.drawer-backdrop').classList.toggle('open',state.drawer);
 document.querySelector('.mobile-menu').setAttribute('aria-expanded',String(state.drawer));
 document.querySelector('.main-wrap').inert=state.drawer;
 document.body.style.overflow=state.drawer?'hidden':'';
}
let dialogOpener=null;
function openDialog(title,body,mode='view'){
 const d=document.getElementById('detail-dialog');if(!d.open){P.histPush('modal');dialogOpener=document.activeElement;const menu=dialogOpener?.closest('.user-menu');if(menu)dialogOpener=menu.querySelector('summary');}
 document.querySelector('.user-menu')?.removeAttribute('open');
 document.getElementById('dialog-title').textContent=title;
 document.getElementById('dialog-content').innerHTML=body;
 d.dataset.mode=mode;d.querySelector('.dialog-foot>span').textContent=mode==='edit'?(P.live?'저장 버튼을 눌러 변경사항을 반영하세요.':'가상 데이터 · 실제 저장되지 않습니다.'):'읽기 전용';
 d._initial=JSON.stringify([...new FormData(d.querySelector('form')||document.createElement('form'))]);
 d.showModal();
}
P.showDialog=openDialog;
function requestClose(discard=false){
 const d=document.getElementById('detail-dialog');if(!d?.open)return;
 if(d.querySelector('form[aria-busy="true"]')){P.notify('저장이 끝난 후 닫을 수 있습니다.');return;}
 const form=d.querySelector('form');
 if(!discard&&form&&JSON.stringify([...new FormData(form)])!==d._initial){
  if(!d.querySelector('.discard-confirm')){d.querySelector('.dialog-content').insertAdjacentHTML('beforeend','<div class="discard-confirm" role="alertdialog" aria-modal="true" aria-labelledby="discard-title"><div class="discard-box"><strong id="discard-title">저장하지 않은 변경사항이 있어요</strong><p>닫기 전에 변경 내용을 저장할까요?</p><div class="discard-actions"><button class="btn" data-action="keep-editing">계속 작성</button><button class="btn" data-action="discard-dialog">저장하지 않고 닫기</button>'+(form.querySelector('[type="submit"]')?'<button class="btn primary" data-action="save-close">저장하고 닫기</button>':'')+'</div></div></div>');}
  d.querySelector('[data-action="keep-editing"]').focus();return;
 }
 d.close();if(dialogOpener?.isConnected)dialogOpener.focus({preventScroll:true});else document.getElementById('main')?.focus({preventScroll:true});
}
app.addEventListener('cancel',event=>{if(event.target.id==='detail-dialog'){event.preventDefault();requestClose();}},true);
P.requestDialogClose=requestClose;
app.addEventListener('click',event=>{
 const category=event.target.closest('#sidebar .nav-item[data-nav-group]');
 if(category){
  state.navGroup=category.dataset.navGroup;
  if(state.navGroup==='home')document.querySelectorAll('#sidebar .nav-group').forEach(group=>{group.open=false;});
  document.querySelectorAll('#sidebar .nav-item').forEach(item=>item.classList.toggle('active',item.dataset.navGroup===state.navGroup));
  return;
 }
 const button=event.target.closest('button');
 if(!button)return;
 if(button.dataset.month){
  const date=new Date(Date.UTC(state.calendar.year,state.calendar.month+Number(button.dataset.month),1));
  state.calendar={year:date.getUTCFullYear(),month:date.getUTCMonth()};
  const kind=P.live?(state.page==='makeup'?'makeup':'regular'):(state.page==='makeup'?'보강':'정규');
  document.getElementById('calendar-panel').innerHTML=P.live&&state.group==='home'?P.homeMakeup(state):P.calendar(state,state.group==='lessons',kind);
  if(P.live&&state.group==='lessons'&&['regular','makeup'].includes(state.page)){
   document.getElementById('lesson-list-panel').innerHTML=P.monthLessonList(state,kind);
  }
  P.slide?.(document.querySelector('#calendar-panel .calendar-grid'),Number(button.dataset.month));
  document.querySelector(`[data-month="${button.dataset.month}"]`).focus();
 }
 if(button.dataset.lesson){
  const lesson=P.visibleLessons(state.role).find(l=>l.id===button.dataset.lesson);
  if(!lesson)return;
  const student=P.mock.students.find(s=>s.id===lesson.studentId),teacher=P.mock.teachers.find(t=>t.id===lesson.teacherId);
  openDialog(student.name+' · 수업 샘플',`<dl><dt>수업일시</dt><dd>2026.10.26 ${lesson.time} · ${lesson.duration}분</dd><dt>담당 강사</dt><dd>${e(teacher.name)}</dd><dt>레슨실</dt><dd>${e(lesson.room)}</dd><dt>수업 구분</dt><dd>${e(lesson.kind)} · ${e(lesson.status)}</dd><dt>현재 교재</dt><dd>${e(student.level)}</dd><dt>수업일지</dt><dd>${lesson.journal?'작성 완료':'미작성'}</dd></dl><p class="subtitle">출결·일지·진도 저장은 후속 단계에서 연결합니다.</p>`);
 }
 if(button.dataset.notice!==undefined){const n=P.mock.notices[Number(button.dataset.notice)];if(n)openDialog(n.label,`<p>${e(n.text)}</p>`);}
 if(button.dataset.action==='notices'&&P.live){openDialog('학원 소식',P.liveNotices());return;}
 if(button.dataset.action==='notices')openDialog('알림 미리보기','<p>11월 수업 일정과 가을 작은 음악회 공지를 확인해 주세요.</p><p class="subtitle">자동 발송 및 실제 알림 수신은 구현되지 않았습니다.</p>');
 if(button.dataset.action==='close-dialog')requestClose();
 if(button.dataset.action==='discard-dialog')requestClose(true);
 if(button.dataset.action==='save-close'){const d=document.getElementById('detail-dialog');d.querySelector('.discard-confirm')?.remove();d.querySelector('form')?.requestSubmit();}
 if(button.dataset.action==='keep-editing'){document.querySelector('.discard-confirm')?.remove();document.querySelector('#detail-dialog input:not([type=hidden]), #detail-dialog textarea, #detail-dialog select')?.focus();}
 if(button.dataset.action==='open-menu'){if(!state.drawer)P.histPush('drawer');state.drawer=true;updateDrawer();document.querySelector('.drawer-close').focus();}
 if(button.dataset.action==='close-menu'){state.drawer=false;updateDrawer();document.querySelector('.mobile-menu').focus();}
});
app.addEventListener('change',event=>{
 if(event.target.id==='role-select'&&!P.live){
  state.role=event.target.value;
  if(!P.canVisit(state.role,state.group,state.page)){state.group='home';state.page='overview';history.replaceState(null,'','#home/overview');}
  const selectedGroup=P.navigation.find(g=>g.id===state.navGroup);
  if(!selectedGroup?.roles.includes(state.role))state.navGroup=state.group;
  render();document.getElementById('role-select').focus();
 }
 if(event.target.dataset.task){
  const task=P.mock.tasks.find(t=>t.id===event.target.dataset.task);
  if(task){task.done=event.target.checked;event.target.closest('.task').classList.toggle('done',task.done);}
 }
});
app.addEventListener('input',event=>{if(event.target.id==='student-search'){P.viewState().query=event.target.value;document.getElementById('student-results').innerHTML=P.studentTable(state.role,event.target.value);}});
app.addEventListener('click',event=>{
 const link=event.target.closest('a[href^="#"]');
 if(link&&state.drawer){state.drawer=false;updateDrawer();if(link.hash===location.hash)document.querySelector('.mobile-menu').focus();}
});
document.addEventListener('keydown',event=>{
 if(event.key==='Escape'&&document.querySelector('dialog[open]')){event.preventDefault();requestClose();return;}
 if(!state.drawer)return;
 if(event.key==='Escape'){state.drawer=false;updateDrawer();document.querySelector('.mobile-menu').focus();}
 if(event.key==='Tab'){
  const focusables=[...document.querySelectorAll('#sidebar a, #sidebar button, #sidebar summary')].filter(el=>el.getClientRects().length);
  const first=focusables[0],last=focusables[focusables.length-1];
  if(event.shiftKey&&document.activeElement===first){event.preventDefault();last.focus();}
  else if(!event.shiftKey&&document.activeElement===last){event.preventDefault();first.focus();}
 }
});
matchMedia('(max-width:900px)').addEventListener('change',()=>{state.drawer=false;updateDrawer();});
window.addEventListener('hashchange',route);
// 뒤로가기(휴대폰 포함): 화면 이동·창·팝업·메뉴를 열 때마다 기록을 남기고, 뒤로가기는 맨 위의 팝업 → 창 → 메뉴를 먼저 닫은 뒤 이전 화면으로.
// Apps Script 웹앱은 google.script.history로 바깥 주소창 기록을 다루고, 미리보기·테스트에서는 일반 history를 씁니다.
(function(){
 const gh=window.google&&google.script&&google.script.history;let skip=false;
 P.histPush=kind=>{const h=location.hash||'#home/overview';try{if(gh)gh.push({k:kind,h},null,h.slice(1));else history.pushState({k:kind,h},'',h);}catch(_e){}};
 const closeTop=()=>{const dc=document.querySelector('.del-confirm');if(dc){dc.remove();return true;}const pop=document.querySelector('.wq-pop');if(pop){pop.remove();return true;}
  const d=document.getElementById('detail-dialog');if(d?.open){requestClose();return true;}if(state.drawer){state.drawer=false;updateDrawer();return true;}const um=document.querySelector('.user-menu[open]');if(um){um.open=false;return true;}return false;};
 const back=target=>{if(closeTop())return;if(target&&target!==location.hash){skip=true;location.hash=target;}};
 window.addEventListener('hashchange',()=>{if(skip){skip=false;return;}if(gh)P.histPush('route');});
 if(gh){try{gh.replace({k:'route',h:location.hash||'#home/overview'},null,(location.hash||'#home/overview').slice(1));gh.setChangeHandler(e=>back(e.state&&e.state.h?e.state.h:(e.location&&e.location.hash?'#'+e.location.hash:'')));}catch(_e){}}
 else{try{history.replaceState({k:'route',h:location.hash},'',location.hash);}catch(_e){}window.addEventListener('popstate',e=>back(e.state&&e.state.h));}
})();
// A menu is a disclosure, not a modal: Esc closes it and returns to its summary.
document.addEventListener('click',event=>{const menu=document.querySelector('.user-menu');if(menu?.open&&!menu.contains(event.target))menu.open=false;});
document.addEventListener('keydown',event=>{const menu=document.querySelector('.user-menu');if(event.key==='Escape'&&menu?.open&&!document.querySelector('dialog[open]')){menu.open=false;menu.querySelector('summary').focus();}});
P.refreshApp=function(){P.saveViewState();render();};
P.startApp=function(){if(P.live){state.role=P.user.role;const date=new Date(P.data.date+'T12:00:00Z');state.calendar={year:date.getUTCFullYear(),month:date.getUTCMonth()};}route();};
P.authBoot();
})(Piano);
</script>

<script>if('serviceWorker'in navigator)addEventListener('load',()=>navigator.serviceWorker.register('sw.js').catch(()=>{}));</script>
